name: Build Cross-Platform Desktop App

on:
  workflow_dispatch: # Trigger manually from GitHub Actions tab when desired

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm --prefix web-dashboard install

      - name: Build Web Dashboard
        run: npm --prefix web-dashboard run build

      - name: Package Desktop App (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        working-directory: web-dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop App (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        working-directory: web-dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never
        working-directory: web-dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeoCare-Desktop-${{ matrix.os }}
          path: web-dashboard/release/*
